# flash_ospi.cfg — write the A53 SMP experiment to the SK-AM64B OSPI NOR.
#
# Use from the SDK's tools/boot directory with the board in UART BOOT MODE:
#   python uart_uniflash.py -p COM<n> --cfg=<path to this file>
# where COM<n> is the CP2105 "Standard COM Port" on micro-USB J11.
# Afterwards switch to OSPI BOOT MODE and power-cycle.
#
# Offsets follow sbl_prebuilt/am64x-sk/default_sbl_ospi.cfg: ROM expects the
# SBL at 0x0; sbl_ospi loads the application image from 0x80000.  The flash
# writer path is relative to tools/boot, as in TI's own cfg files; the other
# two are absolute and must be edited on another machine.
#
# The SBL is NOT the SDK's prebuilt one: TI's am64x-sk sbl_ospi in MCU+ SDK
# 11.01.00.17 hangs after authenticating a signed appimage (see sbl/README.md).
# sbl/sbl_ospi.release.hs_fs.tiimage is the same example rebuilt with the fix.
--flash-writer=sbl_prebuilt/am64x-sk/sbl_uart_uniflash.release.hs_fs.tiimage
--operation=flash-phy-tuning-data
--file=D:/_Academic_/schelueakmc/am64x/a53/sbl/sbl_ospi.release.hs_fs.tiimage --operation=flash --flash-offset=0x0
--file=D:/_Academic_/schelueakmc/am64x/a53/build/a53_smp_sched_latency.release.appimage.hs_fs --operation=flash --flash-offset=0x80000
